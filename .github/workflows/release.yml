name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm with provenance
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none
      # Trusted publishing (OIDC): no npm token is stored anywhere. The npm CLI
      # exchanges this job's OIDC identity for a short-lived credential, which
      # requires npm >= 11.5.1 and the trusted publisher configured on npmjs.com
      # (package Settings -> Publishing access -> GitHub Actions, this repo and
      # workflow file). Provenance is implied by trusted publishing.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run validate:release
      - name: Skip if this version is already on the registry
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "us-tax-advantaged-params@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "us-tax-advantaged-params@${version} is already published; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # prepack runs the full verify suite again as the final publication gate.
      - if: steps.registry.outputs.published == 'false'
        run: npm publish --access public
